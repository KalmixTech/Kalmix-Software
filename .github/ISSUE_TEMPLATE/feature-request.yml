name: Feature request
description: Suggest an improvement for KALMIX Trace.
title: "[Trace feature]: "
labels:
  - product:trace
  - type:feature
body:
  - type: input
    id: version
    attributes:
      label: Current Trace version
      placeholder: 1.5.7
  - type: textarea
    id: workflow
    attributes:
      label: Workflow or problem
      description: Describe the engineering task and why the current workflow is insufficient.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include credentials, private caster details, precise coordinates, serial numbers, customer data, or other secrets.
          required: true

